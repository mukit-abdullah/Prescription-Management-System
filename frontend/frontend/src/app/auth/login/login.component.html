<div class="login-container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <h2>Login</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        [class.invalid]="form.get('username')?.invalid && form.get('username')?.touched"
      />
      <div class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
        Username is required.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
      />
      <div class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Password is required.
      </div>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Logging in...' : 'Login' }}
    </button>
  </form>
</div>
